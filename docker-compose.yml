name: ${SUB_ADDS_NAME:-fastaidesign}

services:
  postgres:
    image: postgres:16-alpine
    container_name: ${SUB_ADDS_NAME:-fastaidesign}-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sub_adds}
      POSTGRES_USER: ${POSTGRES_USER:-sub_adds}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - sub-adds-postgres:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
  redis:
    image: redis:7-alpine
    container_name: ${SUB_ADDS_NAME:-fastaidesign}-redis
    volumes: [sub-adds-redis:/data]
  api:
    restart: unless-stopped
    build: ./backend
    container_name: ${SUB_ADDS_NAME:-fastaidesign}-api
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sub_adds}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-sub_adds}?sslmode=disable
      FASTAIAPI_BASE_URL: ${FASTAIAPI_BASE_URL:-https://fastaiapi.cloud}
      RECHARGE_ENABLED: ${RECHARGE_ENABLED:-false}
      RECHARGE_PUBLIC_URL: ${RECHARGE_PUBLIC_URL:-}
      RECHARGE_GATEWAY: ${RECHARGE_GATEWAY:-https://pay.1kexiu.xyz}
      RECHARGE_PID: ${RECHARGE_PID:-}
      RECHARGE_KEY: ${RECHARGE_KEY:-}
      RECHARGE_ALERT_WEBHOOK_URL: ${RECHARGE_ALERT_WEBHOOK_URL:-}
      RECHARGE_ALERT_TOKEN: ${RECHARGE_ALERT_TOKEN:-}
      RECHARGE_PACKAGES: ${RECHARGE_PACKAGES:-}
      SUB2API_DATABASE_URL: ${SUB2API_DATABASE_URL:-}
      SUB2API_REDIS_URL: ${SUB2API_REDIS_URL:-}
    ports: ["${SUB_ADDS_BACKEND_PORT:-4455}:8080"]
    depends_on: [postgres, redis]
  ui:
    build: ./frontend
    container_name: ${SUB_ADDS_NAME:-fastaidesign}-ui
    ports: ["${SUB_ADDS_FRONTEND_PORT:-4445}:80"]
    depends_on: [api]
volumes:
  sub-adds-postgres:
  sub-adds-redis:
